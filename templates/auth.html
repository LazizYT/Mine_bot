<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINE_BOT_OS | ВХОД</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg0: #07090d;
            --line: rgba(148, 163, 184, 0.14);
            --line-strong: rgba(148, 163, 184, 0.30);
            --text: #dbe4ee;
            --muted: #7e8ca0;
            --cyan: #22d3ee;
            --cyan-soft: rgba(34, 211, 238, 0.14);
            --bad: #fb5e6e;
        }
        body {
            background:
                radial-gradient(900px 600px at 80% -10%, rgba(34, 211, 238, 0.12), transparent 60%),
                radial-gradient(800px 600px at -10% 110%, rgba(167, 139, 250, 0.09), transparent 60%),
                linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px),
                var(--bg0);
            background-size: auto, auto, 44px 44px, 44px 44px, auto;
            background-attachment: fixed;
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .auth-card {
            background: linear-gradient(180deg, rgba(28, 38, 54, 0.7), rgba(14, 21, 33, 0.75));
            backdrop-filter: blur(16px);
            border: 1px solid var(--line-strong);
            border-radius: 16px;
            width: 100%; max-width: 400px; padding: 34px 32px;
            box-shadow: 0 0 0 1px rgba(34,211,238,0.10), 0 30px 70px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }
        .auth-card::before {
            content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }
        .auth-title {
            font-family: 'Chakra Petch', sans-serif; font-weight: 700;
            color: var(--text); letter-spacing: 0.16em; font-size: 1.15rem;
        }
        .auth-title .dot { color: var(--cyan); text-shadow: 0 0 14px rgba(34,211,238,0.8); }
        .auth-sub { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
        .btn-mc {
            border-radius: 8px; text-transform: uppercase; font-size: 0.7rem;
            letter-spacing: 0.12em; border-width: 1px; padding: 9px 18px;
            background: transparent; transition: all 0.2s ease; font-weight: 600;
        }
        .btn-primary-mc { border-color: var(--cyan); color: var(--cyan); }
        .btn-primary-mc:hover { background: var(--cyan); color: #06121a; box-shadow: 0 0 18px rgba(34,211,238,0.5); }
        .btn-purple-mc { border-color: #a78bfa; color: #a78bfa; }
        .btn-purple-mc:hover { background: #a78bfa; color: #0b0a16; box-shadow: 0 0 18px rgba(167,139,250,0.45); }
        .form-control {
            background: rgba(8, 12, 18, 0.7) !important; color: var(--text) !important;
            border: 1px solid var(--line-strong); border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem;
        }
        .form-control:focus {
            border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.15);
            background: rgba(10, 15, 22, 0.9) !important; color: #fff !important;
        }
        label { color: var(--text) !important; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; }
        .err { color: var(--bad); font-size: 0.7rem; min-height: 1em; }
        hr { border-color: var(--line) !important; opacity: 1; }
        .tg-hint { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.04em; }
        .tg-badge {
            display: inline-block; padding: 2px 8px; margin-bottom: 14px;
            border: 1px solid rgba(34,211,238,0.4); border-radius: 999px;
            color: var(--cyan); font-size: 0.55rem; letter-spacing: 0.14em;
            background: var(--cyan-soft); text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center">
        <div class="tg-badge">OWNER ACCESS</div>
    </div>
    <h1 class="text-center mb-1 auth-title">🔐 <span class="dot">//</span>MINE_OS PANEL</h1>
    <p class="text-center auth-sub mb-4">Вход только для владельца</p>
    <div id="tg-zone" class="text-center">
        <button class="btn btn-primary-mc btn-mc px-4" id="btn-tg" onclick="tgLogin()">ВОЙТИ ЧЕРЕЗ TELEGRAM</button>
        <div class="mt-2 tg-hint">Если кнопка не сработала — открой панель из бота (кнопка Studio)</div>
    </div>
    <hr>
    <div class="mb-2"><label>LOGIN</label>
        <input class="form-control" id="login" value="{{ config.PANEL_USER }}"></div>
    <div class="mb-3"><label>PASSWORD</label>
        <input class="form-control" id="password" type="password" placeholder="••••••••"></div>
    <button class="btn btn-purple-mc btn-mc w-100" onclick="basicLogin()">ВОЙТИ ПО ПАРОЛЮ</button>
    <div class="err text-center mt-2" id="err"></div>
</div>

<script>
    const next = new URLSearchParams(location.search).get('next') || '/';

    function showErr(m) { document.getElementById('err').textContent = m || ''; }

    function tgLogin() {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (!tg || !tg.initData) { showErr('Нет данных Telegram. Откройте панель через бота.'); return; }
        tg.ready();
        fetch('/api/auth/tg', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: tg.initData })
        }).then(r => r.json()).then(d => {
            if (d.status === 'success') { location.href = next; }
            else showErr('Доступ запрещён: вы не владелец панели.');
        }).catch(() => showErr('Ошибка сети'));
    }

    function basicLogin() {
        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;
        if (!password) { showErr('Введите пароль'); return; }
        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: login, password: password })
        }).then(r => r.json()).then(d => {
            if (d.status === 'success') { location.href = next; }
            else showErr('Неверный логин или пароль');
        }).catch(() => showErr('Ошибка сети'));
    }

    // Автологин через Telegram, если панель открыта внутри Telegram WebApp
    (function() {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initData) { tgLogin(); }
    })();
</script>
</body>
</html>
